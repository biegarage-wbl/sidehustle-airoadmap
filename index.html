<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Side Hustle Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6;
            --secondary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-main), #1e1b4b);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Typography & Utils */
        .gradient-text {
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        #quote {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            text-align: center;
            padding: 15px;
        }
        .stat-card h3 {
            font-size: 2rem;
            margin: 5px 0;
            color: var(--accent);
        }
        .stat-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            height: 12px;
            margin: 15px 0;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Badges */
        .badges-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .badge {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0.4;
            filter: grayscale(100%);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .badge.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        /* Roadmap Section */
        .week-header {
            margin: 30px 0 15px;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .day-card {
            cursor: pointer;
            margin-bottom: 15px;
        }
        .day-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.3);
        }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-header h4 {
            font-size: 1.1rem;
        }
        .day-status {
            font-size: 1.2rem;
        }

        .day-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--glass-border);
            animation: fadeIn 0.3s ease;
        }
        .day-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms & Buttons */
        .checklist {
            list-style: none;
            margin: 10px 0;
        }
        .checklist li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            resize: vertical;
            min-height: 80px;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .eval-container {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .eval-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .eval-btn.selected {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-complete {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-complete:hover {
            opacity: 0.9;
        }
        .btn-complete:active {
            transform: scale(0.98);
        }
        .btn-complete:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* Utilities */
        .completed-card {
            border-color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }
        .tip-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--secondary);
            padding: 10px;
            margin: 10px 0;
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="gradient-text">AI Side Hustle Roadmap</h1>
        <p>30 Hari Menuju Penghasilan Pertama</p>
        <p id="quote" class="mt-2"></p>
    </header>

    <section class="glass dashboard">
        <h2>Dashboard Progress</h2>
        
        <div class="progress-container">
            <div class="progress-bar" id="main-progress"></div>
        </div>
        
        <div class="dashboard-grid">
            <div class="glass stat-card">
                <p>Level User</p>
                <h3 id="stat-level">1</h3>
            </div>
            <div class="glass stat-card">
                <p>XP Point</p>
                <h3 id="stat-xp">0</h3>
            </div>
            <div class="glass stat-card">
                <p>Hari Selesai</p>
                <h3 id="stat-days">0/30</h3>
            </div>
            <div class="glass stat-card">
                <p>Progress</p>
                <h3 id="stat-percent">0%</h3>
            </div>
        </div>

        <div class="badges-container" id="badges-container">
            </div>
    </section>

    <div id="roadmap-container">
        </div>
</div>

<script>
    // --- DATA ---
    const quotes = [
        "\"Satu prompt yang tepat lebih berharga dari seribu baris kode manual.\"",
        "\"AI tidak akan menggantikanmu. Orang yang menggunakan AI yang akan melakukannya.\"",
        "\"Konsistensi adalah mata uang termahal dalam membangun portfolio.\"",
        "\"Gagal hari ini adalah data training untuk sukses besok.\""
    ];

    const badgesData = [
        { id: 'beginner', icon: '🥚', name: 'Beginner', reqDays: 1 },
        { id: 'prompt_master', icon: '🧙‍♂️', name: 'Prompt Master', reqDays: 7 },
        { id: 'portfolio', icon: '📁', name: 'Portfolio Builder', reqDays: 14 },
        { id: 'first_client', icon: '🤝', name: 'First Client', reqDays: 21 },
        { id: 'first_income', icon: '💰', name: 'First Income', reqDays: 30 }
    ];

    // Generate 30 Days Data
    const roadmap = [];
    const weeks = [
        { title: "Minggu 1: Fondasi AI & Prompting", desc: "Kuasai alat dan cara berbicara dengan AI." },
        { title: "Minggu 2: Membangun Portfolio", desc: "Buat karya nyata untuk dipamerkan." },
        { title: "Minggu 3: Mencari Klien & Leads", desc: "Setup profil freelancer & outreach." },
        { title: "Minggu 4: Closing & Penghasilan Pertama", desc: "Negosiasi, delivery, dan gajian." }
    ];

    for (let i = 1; i <= 30; i++) {
        let week = Math.ceil(i / 7);
        if (week > 4) week = 4;
        
        roadmap.push({
            id: i,
            week: week,
            title: `Hari ${i}: ${getTaskTitle(i)}`,
            mission: getMission(i),
            checklist: ["Pahami konsep hari ini", "Praktek 30 menit", "Catat hasil eksperimen"],
            tip: getTip(i)
        });
    }

    function getTaskTitle(day) {
        const titles = [
            "Mindset & Setup Alat Dasar","Membuat Akun & Eksplorasi ChatGPT","Fundamental Prompt Engineering","Mengenal AI Image Generator","Optimasi Workflow Pribadi","Merangkum Keahlian (Niche)","Review Minggu 1",
            "Membangun Profil Upwork/Fiverr","Membuat 3 Mock Project AI Content","Membuat Mock Project AI Design","Menyusun Copywriting Portfolio","Setup Linktree/Notion Portfolio","Mencari Referensi Harga Pasar","Review Minggu 2",
            "Identifikasi Target Klien","Membuat Template Cold Email/DM","Outreach ke 5 Calon Klien Pertama","Optimasi Profil LinkedIn","Bergabung ke Komunitas Bisnis","Follow Up Leads Pertama","Review Minggu 3",
            "Menangani Keberatan Klien (Objections)","Simulasi Meeting Klien","Menentukan Pricing & Paket","Closing Strategy","Eksekusi Project Klien (Tahap 1)","Eksekusi Project Klien (Tahap 2)","Quality Control dengan AI","Delivery Project","Evaluasi & Merayakan Penghasilan!"
        ];
        return titles[day - 1];
    }

    function getMission(day) {
        if(day <= 7) return "Fokus pada penguasaan prompt dan memahami batasan AI.";
        if(day <= 14) return "Ubah skill prompting menjadi aset digital yang bisa dipamerkan.";
        if(day <= 21) return "Jangan malu. Mulai tawarkan jasa ke pasar.";
        return "Fokus pada konversi, pelayanan memuaskan, dan bayaran pertamamu.";
    }

    function getTip(day) {
        const tips = ["Gunakan format: Peran + Tugas + Konteks + Format.", "Kualitas portofolio lebih penting dari kuantitas.", "Personalize pesan DM kamu, jangan terlihat seperti bot.", "Over-deliver. Berikan bonus kecil untuk klien pertama."];
        return tips[Math.floor((day-1)/8)] || "Tetap konsisten, sedikit demi sedikit jadi bukit.";
    }

    // --- STATE MANAGEMENT ---
    let state = JSON.parse(localStorage.getItem('aiHustleState')) || {
        xp: 0,
        completedDays: [],
        journals: {},
        evaluations: {}
    };

    function saveState() {
        localStorage.setItem('aiHustleState', JSON.stringify(state));
        updateDashboard();
    }

    // --- UI LOGIC ---
    function init() {
        document.getElementById('quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];
        renderRoadmap();
        updateDashboard();
    }

    function updateDashboard() {
        const totalDays = roadmap.length;
        const completedCount = state.completedDays.length;
        const percent = Math.round((completedCount / totalDays) * 100);
        const level = Math.floor(state.xp / 100) + 1;

        document.getElementById('stat-level').innerText = level;
        document.getElementById('stat-xp').innerText = state.xp;
        document.getElementById('stat-days').innerText = `${completedCount}/${totalDays}`;
        document.getElementById('stat-percent').innerText = `${percent}%`;
        document.getElementById('main-progress').style.width = `${percent}%`;

        renderBadges(completedCount);
    }

    function renderBadges(completedCount) {
        const container = document.getElementById('badges-container');
        container.innerHTML = '';
        badgesData.forEach(badge => {
            const isUnlocked = completedCount >= badge.reqDays;
            container.innerHTML += `
                <div class="badge ${isUnlocked ? 'unlocked' : ''}" title="Butuh ${badge.reqDays} hari">
                    <span>${badge.icon}</span> ${badge.name}
                </div>
            `;
        });
    }

    function renderRoadmap() {
        const container = document.getElementById('roadmap-container');
        container.innerHTML = '';

        for (let w = 1; w <= 4; w++) {
            const weekDays = roadmap.filter(d => d.week === w);
            
            let html = `
                <h3 class="week-header gradient-text">${weeks[w-1].title}</h3>
                <p style="color: var(--text-muted); margin-bottom: 15px; font-size: 0.9rem;">${weeks[w-1].desc}</p>
            `;

            weekDays.forEach(day => {
                const isCompleted = state.completedDays.includes(day.id);
                const journalVal = state.journals[day.id] || '';
                const evalVal = state.evaluations[day.id] || 0;

                html += `
                    <div class="glass day-card ${isCompleted ? 'completed-card' : ''}" id="card-${day.id}">
                        <div class="day-header" onclick="toggleDay(${day.id})">
                            <h4>${day.title}</h4>
                            <span class="day-status">${isCompleted ? '✅' : '🔒'}</span>
                        </div>
                        <div class="day-content" id="content-${day.id}">
                            <p><strong>🎯 Misi:</strong> ${day.mission}</p>
                            <div class="tip-box">💡 <strong>Tips:</strong> ${day.tip}</div>
                            
                            <ul class="checklist">
                                ${day.checklist.map(c => `<li><input type="checkbox" ${isCompleted ? 'checked disabled' : ''}> ${c}</li>`).join('')}
                            </ul>

                            <textarea id="journal-${day.id}" placeholder="Catatan jurnal harianmu di sini..." ${isCompleted ? 'disabled' : ''}>${journalVal}</textarea>

                            <p style="margin-bottom: 5px;">Rate produktivitas hari ini (1-5):</p>
                            <div class="eval-container" id="eval-${day.id}">
                                ${[1,2,3,4,5].map(n => `
                                    <button class="eval-btn ${evalVal == n ? 'selected' : ''}" 
                                            onclick="selectEval(${day.id}, ${n})" 
                                            ${isCompleted ? 'disabled' : ''}>${n}</button>
                                `).join('')}
                            </div>

                            <button class="btn-complete" id="btn-${day.id}" 
                                ${isCompleted ? 'disabled' : ''} 
                                onclick="completeDay(${day.id})">
                                ${isCompleted ? 'Misi Selesai (+50 XP)' : 'Selesaikan Misi (+50 XP)'}
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML += html;
        }
    }

    function toggleDay(id) {
        const content = document.getElementById(`content-${id}`);
        content.classList.toggle('active');
    }

    function selectEval(dayId, score) {
        if(state.completedDays.includes(dayId)) return;
        state.evaluations[dayId] = score;
        
        // Update UI logic for buttons
        const container = document.getElementById(`eval-${dayId}`);
        const btns = container.querySelectorAll('.eval-btn');
        btns.forEach(b => b.classList.remove('selected'));
        btns[score-1].classList.add('selected');
    }

    function completeDay(id) {
        if(state.completedDays.includes(id)) return;

        // Validation eval
        if(!state.evaluations[id]) {
            alert('Pilih skor evaluasi 1-5 dulu boss!');
            return;
        }

        // Save journal
        const journalVal = document.getElementById(`journal-${id}`).value;
        state.journals[id] = journalVal;

        // Update State
        state.completedDays.push(id);
        state.xp += 50;
        
        saveState();
        
        // Quick visual update without full re-render to keep modal open
        document.getElementById(`card-${id}`).classList.add('completed-card');
        const header = document.getElementById(`card-${id}`).querySelector('.day-status');
        header.innerText = '✅';
        
        const btn = document.getElementById(`btn-${id}`);
        btn.disabled = true;
        btn.innerText = 'Misi Selesai (+50 XP)';
        
        document.getElementById(`journal-${id}`).disabled = true;
        
        // Auto close after 1 sec
        setTimeout(() => {
            toggleDay(id);
        }, 1000);
    }

    // Run
    init();
</script>

</body>
</html>
